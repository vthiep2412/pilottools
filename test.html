<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nautical Vector & True Course Calculator</title>

  <!-- Leaflet Map CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    #map {
      flex: 1;
      height: 100%;
    }

    #panel {
      width: 340px;
      background: #1e293b;
      color: #f8fafc;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      box-shadow: -2px 0 10px rgba(0, 0, 0, 0.3);
      z-index: 1000;
      overflow-y: auto;
    }

    h2 {
      font-size: 1.25rem;
      border-bottom: 2px solid #334155;
      padding-bottom: 8px;
      color: #38bdf8;
    }

    .info-card {
      background: #0f172a;
      border-radius: 8px;
      padding: 14px;
      border: 1px solid #334155;
    }

    .info-card h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .value {
      font-size: 1.5rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    .value span {
      font-size: 0.9rem;
      font-weight: 400;
      color: #38bdf8;
    }

    .coords {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.4;
    }

    .instructions {
      font-size: 0.85rem;
      color: #94a3b8;
      line-height: 1.4;
      background: rgba(56, 189, 248, 0.1);
      padding: 10px;
      border-left: 3px solid #38bdf8;
      border-radius: 4px;
    }

    button {
      padding: 10px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }

    button:hover {
      background: #dc2626;
    }
  </style>
</head>
<body>

  <div id="panel">
    <h2>Navigational Vector</h2>
    
    <div class="instructions" id="instruction-text">
      Click on the map to set <b>Point A (Start)</b>.
    </div>

    <div class="info-card">
      <h3>Distance</h3>
      <div class="value" id="dist-display">-- <span>NM</span></div>
    </div>

    <div class="info-card">
      <h3>True Course (Initial Bearing)</h3>
      <div class="value" id="course-display">-- <span>°T</span></div>
    </div>

    <div class="info-card">
      <h3>Waypoints</h3>
      <div class="coords" id="point-a"><b>A:</b> Not set</div>
      <div class="coords" id="point-b" style="margin-top: 6px;"><b>B:</b> Not set</div>
    </div>

    <button onclick="resetVector()">Clear Points</button>
  </div>

  <div id="map"></div>

  <!-- Leaflet Map JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    // Initialize Leaflet Map
    const map = L.map('map').setView([20.0, 0.0], 3);

    // OpenStreetMap Tile Layer
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    let pointA = null;
    let pointB = null;
    let markerA = null;
    let markerB = null;
    let polyline = null;

    // Convert Degrees to Radians
    const toRad = deg => deg * (Math.PI / 180);
    // Convert Radians to Degrees
    const toDeg = rad => rad * (180 / Math.PI);

    // Great-circle Distance in Nautical Miles (Haversine formula)
    function calculateDistanceNM(lat1, lon1, lat2, lon2) {
      const R_nm = 3440.065; // Earth radius in Nautical Miles
      const phi1 = toRad(lat1), phi2 = toRad(lat2);
      const deltaPhi = toRad(lat2 - lat1);
      const deltaLambda = toRad(lon2 - lon1);

      const a = Math.sin(deltaPhi / 2) ** 2 +
                Math.cos(phi1) * Math.cos(phi2) *
                Math.sin(deltaLambda / 2) ** 2;

      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
      return R_nm * c;
    }

    // Initial True Course (Great-circle bearing)
    function calculateTrueCourse(lat1, lon1, lat2, lon2) {
      const phi1 = toRad(lat1), phi2 = toRad(lat2);
      const deltaLambda = toRad(lon2 - lon1);

      const y = Math.sin(deltaLambda) * Math.cos(phi2);
      const x = Math.cos(phi1) * Math.sin(phi2) -
                Math.sin(phi1) * Math.cos(phi2) * Math.cos(deltaLambda);

      let bearing = toDeg(Math.atan2(y, x));
      return (bearing + 360) % 360; // Normalize between 000° and 360°
    }

    function formatCoordinate(lat, lon) {
      const latDir = lat >= 0 ? 'N' : 'S';
      const lonDir = lon >= 0 ? 'E' : 'W';
      return `${Math.abs(lat).toFixed(4)}° ${latDir}, ${Math.abs(lon).toFixed(4)}° ${lonDir}`;
    }

    function updateCalculations() {
      if (!pointA || !pointB) return;

      const dist = calculateDistanceNM(pointA.lat, pointA.lng, pointB.lat, pointB.lng);
      const course = calculateTrueCourse(pointA.lat, pointA.lng, pointB.lat, pointB.lng);

      document.getElementById('dist-display').innerHTML = `${dist.toFixed(2)} <span>NM</span>`;
      document.getElementById('course-display').innerHTML = `${course.toFixed(1).padStart(5, '0')} <span>°T</span>`;
      
      document.getElementById('point-a').innerHTML = `<b>A:</b> ${formatCoordinate(pointA.lat, pointA.lng)}`;
      document.getElementById('point-b').innerHTML = `<b>B:</b> ${formatCoordinate(pointB.lat, pointB.lng)}`;

      // Update vector line on the map
      if (polyline) map.removeLayer(polyline);
      polyline = L.polyline([pointA, pointB], {
        color: '#0284c7',
        weight: 4,
        dashArray: '8, 6'
      }).addTo(map);
    }

    // Map Click Handler
    map.on('click', (e) => {
      if (!pointA) {
        pointA = e.latlng;
        markerA = L.marker(pointA, { draggable: true })
          .addTo(map)
          .bindTooltip("Point A (Start)", { permanent: true, direction: 'top' });

        markerA.on('drag', (ev) => {
          pointA = ev.target.getLatLng();
          updateCalculations();
        });

        document.getElementById('instruction-text').innerHTML = 'Now click to set <b>Point B (Destination)</b>.';
        document.getElementById('point-a').innerHTML = `<b>A:</b> ${formatCoordinate(pointA.lat, pointA.lng)}`;
      } else if (!pointB) {
        pointB = e.latlng;
        markerB = L.marker(pointB, { draggable: true })
          .addTo(map)
          .bindTooltip("Point B (Destination)", { permanent: true, direction: 'top' });

        markerB.on('drag', (ev) => {
          pointB = ev.target.getLatLng();
          updateCalculations();
        });

        document.getElementById('instruction-text').innerHTML = 'Vector calculated! Drag either marker to adjust.';
        updateCalculations();
      }
    });

    function resetVector() {
      if (markerA) map.removeLayer(markerA);
      if (markerB) map.removeLayer(markerB);
      if (polyline) map.removeLayer(polyline);

      pointA = null;
      pointB = null;
      markerA = null;
      markerB = null;
      polyline = null;

      document.getElementById('dist-display').innerHTML = '-- <span>NM</span>';
      document.getElementById('course-display').innerHTML = '-- <span>°T</span>';
      document.getElementById('point-a').innerHTML = '<b>A:</b> Not set';
      document.getElementById('point-b').innerHTML = '<b>B:</b> Not set';
      document.getElementById('instruction-text').innerHTML = 'Click on the map to set <b>Point A (Start)</b>.';
    }
  </script>
</body>
</html>
